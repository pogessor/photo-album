services:
  postgres:
    image: postgres:16-alpine
    container_name: photo-album-postgres
    environment:
      POSTGRES_DB: photoalbum
      POSTGRES_USER: photoalbum
      POSTGRES_PASSWORD: photoalbum
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photoalbum -d photoalbum"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: photo-album-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/photoalbum
      SPRING_DATASOURCE_USERNAME: photoalbum
      SPRING_DATASOURCE_PASSWORD: photoalbum
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8080:8080"
    volumes:
      - ./backend/uploads:/app/uploads

volumes:
  postgres_data: